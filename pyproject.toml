[project]
name = "neuhof-backend"
version = "0.1.0"
description = "Backend for discovering the current SV Neuhof XbotGo livestream and redirecting viewers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.16,<2.0",
    "pydantic-settings>=2.10,<3.0",
    "selenium>=4.35,<5.0",
    "httpx>=0.28,<1.0",
    "tzdata>=2025.2"
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
